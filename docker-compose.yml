services:
  db:
    image: mysql:8.0
    container_name: stocksense-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: stocksense
      MYSQL_USER: ${DB_USERNAME:-appuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-apppassword}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stocksense-backend
    environment:
      DB_URL: jdbc:mysql://db:3306/stocksense?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: ${DB_USERNAME:-appuser}
      DB_PASSWORD: ${DB_PASSWORD:-apppassword}
      ML_SERVICE_URL: http://ml-service:8000
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: stocksense-ml
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  frontend:
    image: nginx:alpine
    container_name: stocksense-frontend
    ports:
      - "80:80"
    volumes:
      - ./frontend/web:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  db_data:
