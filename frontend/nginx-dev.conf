# ============================================================================
# nginx de DESENVOLVIMENTO — espelha o roteamento do Caddyfile de produção.
#
# Por que existe (D-09). Em produção o Caddy serve o estático E faz proxy de
# /api/* para o backend: front e API ficam na MESMA origem, então o frontend
# usa caminho relativo ('/api'). Sem este arquivo, o nginx de dev só serve
# estático e a API vive noutra origem (:8080) — obrigando o front a saber em
# qual ambiente está, que é exatamente o acoplamento que o D-09 remove.
#
# Com ele, dev e produção têm a mesma topologia e API_BASE_URL = '/api' vale
# nos dois. Efeito colateral bem-vindo: o CORS deixa de ser necessário em dev
# (o bean do SecurityConfig passa a ser redundante, e inofensivo).
#
# Quem serve o front FORA do Docker (live server em :5500, por exemplo) não
# passa por aqui: use o override documentado em frontend/web/js/core/config.js.
# ============================================================================

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Upload da importação (S3/T3). O default do nginx é 1m e devolveria 413
    # antes de chegar ao backend, que aceita 5MB (application.yml:5-6).
    client_max_body_size 5m;

    # A API primeiro — mesma precedência do Caddyfile: a rota que casa vence.
    # proxy_pass sem path preserva o URI inteiro, e os controllers já mapeiam
    # /api/... diretamente (não há context-path no Spring).
    location /api/ {
        proxy_pass http://backend:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # R1: POST /api/motor/recalcular é UMA requisição que dura minutos.
        # O default de 60s do nginx cortaria o lote no meio; o Caddy não impõe
        # timeout, daí os 30 min aqui para as duas pontas se comportarem igual.
        proxy_connect_timeout   75s;
        proxy_send_timeout    1800s;
        proxy_read_timeout    1800s;

        # O motor responde de uma vez: sem buffer, o navegador recebe na hora.
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
