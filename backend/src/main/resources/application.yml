spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/stocksense?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  cloud:
    openfeign:
      client:
        config:
          ml-service:
            connect-timeout: 5000
            read-timeout: 30000

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8000}

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    br.com.stocksense: INFO
    org.springframework.cloud.openfeign: DEBUG
