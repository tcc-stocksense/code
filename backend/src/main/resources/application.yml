spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/stocksense?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  cloud:
    openfeign:
      client:
        config:
          ml-service:
            connect-timeout: 5000
            read-timeout: 30000

ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8000}

jwt:
  # Sem default de proposito (D-10): variavel ausente quebra o boot em vez de
  # subir com um segredo versionado. O valor de dev vem do docker-compose.yml.
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# Actuator (D-12): expoe apenas /actuator/health, para o healthcheck do Docker.
# show-details: never mantem a resposta em {"status":"UP"} — sem detalhe de
# banco, disco ou versao. Nao ha rota para /actuator no Caddyfile, entao o
# endpoint so e alcancavel de dentro da rede Docker.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    br.com.stocksense: INFO
    org.springframework.cloud.openfeign: DEBUG

# Recalculo mensal automatico (T-35). O fuso e explicito porque os containers
# rodam em UTC: sem ele, "3h" seria meia-noite no horario de Brasilia, perto
# demais da virada do mes. Desligue com enabled=false em ambientes onde o
# recalculo automatico atrapalha (ex.: maquina de desenvolvimento).
motor:
  scheduler:
    enabled: ${MOTOR_SCHEDULER_ENABLED:true}
    cron: ${MOTOR_SCHEDULER_CRON:0 0 3 1 * *}
    zone: ${MOTOR_SCHEDULER_ZONE:America/Sao_Paulo}
